# Postiz for Sugimoto Visa, sharing the existing Hetzner server with Odoo.
#
# Key difference from a standalone install: this stack NEVER binds ports 80 or
# 443. The host's existing nginx (which already serves Odoo) proxies
# post.sugimotogroup.org to 127.0.0.1:4007. Odoo is untouched.
#
# Hardening carried over from the earlier work:
#  - nginx inside the postiz image proxies to "localhost" which resolves to ::1
#    first, while the app listens on IPv4 only, so every request 502s. The
#    patched nginx.conf below is mounted over the baked-in copy.
#  - Every temporal service gets restart: always, so a reboot brings them back.
#  - temporal's auto-setup raced its database and exited 1 for good. Healthchecks
#    plus depends_on: service_healthy gate the startup order.
services:
  postiz:
    image: ghcr.io/gitroomhq/postiz-app:latest
    container_name: postiz
    restart: always
    env_file: .env
    environment:
      DATABASE_URL: 'postgresql://postiz-user:${POSTGRES_PASSWORD}@postiz-postgres:5432/postiz-db-local'
      REDIS_URL: 'redis://postiz-redis:6379'
      BACKEND_INTERNAL_URL: 'http://localhost:3000'
      TEMPORAL_ADDRESS: 'temporal:7233'
      IS_GENERAL: 'true'
      STORAGE_PROVIDER: 'local'
      UPLOAD_DIRECTORY: '/uploads'
      NEXT_PUBLIC_UPLOAD_DIRECTORY: '/uploads'
      API_LIMIT: 30
      NX_ADD_PLUGINS: false
    volumes:
      - postiz-config:/config/
      - postiz-uploads:/uploads/
      - ./postiz-internal-nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - '127.0.0.1:4007:5000'
    networks: [postiz-network, temporal-network]
    depends_on:
      postiz-postgres: {condition: service_healthy}
      postiz-redis: {condition: service_healthy}
      temporal: {condition: service_healthy}

  postiz-postgres:
    image: postgres:17-alpine
    container_name: postiz-postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: postiz-user
      POSTGRES_DB: postiz-db-local
    volumes: [postgres-volume:/var/lib/postgresql/data]
    networks: [postiz-network]
    healthcheck:
      test: pg_isready -U postiz-user -d postiz-db-local
      interval: 10s
      timeout: 3s
      retries: 3

  postiz-redis:
    image: redis:7.2
    container_name: postiz-redis
    restart: always
    healthcheck:
      test: redis-cli ping
      interval: 10s
      timeout: 3s
      retries: 3
    volumes: [postiz-redis-data:/data]
    networks: [postiz-network]

  temporal-elasticsearch:
    container_name: temporal-elasticsearch
    image: elasticsearch:7.17.27
    restart: always
    environment:
      - cluster.routing.allocation.disk.threshold_enabled=true
      - cluster.routing.allocation.disk.watermark.low=512mb
      - cluster.routing.allocation.disk.watermark.high=256mb
      - cluster.routing.allocation.disk.watermark.flood_stage=128mb
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
      - xpack.security.enabled=false
    networks: [temporal-network]
    expose: ['9200']
    volumes: [temporal-es-data:/usr/share/elasticsearch/data]

  temporal-postgresql:
    container_name: temporal-postgresql
    image: postgres:16
    restart: always
    environment:
      POSTGRES_PASSWORD: temporal
      POSTGRES_USER: temporal
    networks: [temporal-network]
    expose: ['5432']
    volumes: [temporal-pg-data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U temporal']
      interval: 10s
      timeout: 3s
      retries: 10

  temporal:
    container_name: temporal
    image: temporalio/auto-setup:1.28.1
    restart: always
    depends_on:
      temporal-postgresql: {condition: service_healthy}
      temporal-elasticsearch: {condition: service_started}
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-postgresql
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
      - ENABLE_ES=true
      - ES_SEEDS=temporal-elasticsearch
      - ES_VERSION=v7
      - TEMPORAL_NAMESPACE=default
    networks: [temporal-network]
    volumes: ['./dynamicconfig:/etc/temporal/config/dynamicconfig']
    healthcheck:
      test: ['CMD', 'tctl', '--address', 'temporal:7233', 'cluster', 'health']
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

volumes:
  postgres-volume:
  postiz-redis-data:
  postiz-config:
  postiz-uploads:
  temporal-es-data:
  temporal-pg-data:

networks:
  postiz-network:
  temporal-network:
    driver: bridge
    name: temporal-network
