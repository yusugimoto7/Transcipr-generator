#cloud-config
# Unattended Postiz install for a fresh Hetzner Cloud server.
#
# This runs once, on first boot, as root. Nobody has to log in for the install
# to complete, which is the point: no SSH password is needed anywhere.
#
# It carries the three fixes found the hard way on the earlier install:
#   1. The nginx baked into the Postiz image proxies to "localhost", which
#      resolves to ::1 first, while the app listens on IPv4 only, so every
#      request 502s. The patched config below pins 127.0.0.1.
#   2. Every Temporal service gets "restart: always" so a reboot brings the
#      whole stack back without help.
#   3. Temporal's auto-setup used to race its own database, fail schema setup
#      and exit for good. Healthchecks plus depends_on gate the startup order.

package_update: true
packages:
  - ca-certificates
  - curl
  - jq
  - debian-keyring
  - debian-archive-keyring
  - apt-transport-https

write_files:
  - path: /opt/postiz/postiz-internal-nginx.conf
    permissions: '0644'
    content: |
      user                            www;
      worker_processes                auto;
      events { worker_connections 1024; }
      http {
          include                     /etc/nginx/mime.types;
          default_type                application/octet-stream;
          sendfile                    on;
          access_log                  /var/log/nginx/access.log;
          client_max_body_size 2G;
          server {
              listen 5000;
              server_name _;
              gzip on;
              location /api/ {
                  proxy_pass http://127.0.0.1:3000/;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_set_header Reload $http_reload;
                  proxy_set_header Onboarding $http_onboarding;
                  proxy_set_header Activate $http_activate;
                  proxy_set_header Auth $http_auth;
                  proxy_set_header Showorg $http_showorg;
                  proxy_set_header Impersonate $http_impersonate;
                  proxy_set_header Accept-Language $http_accept_language;
              }
              location /uploads/ {
                  alias /uploads/;
                  add_header X-Content-Type-Options "nosniff" always;
                  types {
                      image/jpeg jpg jpeg; image/png png; image/gif gif;
                      image/webp webp; image/avif avif; video/mp4 mp4;
                  }
                  default_type application/octet-stream;
              }
              location / {
                  proxy_pass http://127.0.0.1:4200/;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_set_header Reload $http_reload;
                  proxy_set_header Onboarding $http_onboarding;
                  proxy_set_header Activate $http_activate;
                  proxy_set_header Auth $http_auth;
                  proxy_set_header Showorg $http_showorg;
                  proxy_set_header Impersonate $http_impersonate;
                  proxy_set_header Accept-Language $http_accept_language;
                  proxy_set_header i18next $http_i18next;
              }
          }
      }

  - path: /opt/postiz/dynamicconfig/development-sql.yaml
    permissions: '0644'
    content: |
      limit.maxIDLength:
        - value: 255
          constraints: {}
      system.forceSearchAttributesCacheRefreshOnRead:
        - value: true
          constraints: {}

  - path: /opt/postiz/Caddyfile
    permissions: '0644'
    content: |
      post.sugimotogroup.org {
      	encode gzip
      	reverse_proxy 127.0.0.1:4007 {
      		transport http {
      			read_timeout 30m
      			write_timeout 30m
      		}
      	}
      }

  - path: /opt/postiz/docker-compose.yaml
    permissions: '0644'
    content: |
      services:
        postiz:
          image: ghcr.io/gitroomhq/postiz-app:latest
          container_name: postiz
          restart: always
          env_file: .env
          environment:
            DATABASE_URL: 'postgresql://postiz-user:${POSTGRES_PASSWORD}@postiz-postgres:5432/postiz-db-local'
            REDIS_URL: 'redis://postiz-redis:6379'
            BACKEND_INTERNAL_URL: 'http://localhost:3000'
            TEMPORAL_ADDRESS: 'temporal:7233'
            IS_GENERAL: 'true'
            STORAGE_PROVIDER: 'local'
            UPLOAD_DIRECTORY: '/uploads'
            NEXT_PUBLIC_UPLOAD_DIRECTORY: '/uploads'
            API_LIMIT: 30
            NX_ADD_PLUGINS: false
          volumes:
            - postiz-config:/config/
            - postiz-uploads:/uploads/
            - ./postiz-internal-nginx.conf:/etc/nginx/nginx.conf:ro
          ports:
            - '127.0.0.1:4007:5000'
          networks: [postiz-network, temporal-network]
          depends_on:
            postiz-postgres: {condition: service_healthy}
            postiz-redis: {condition: service_healthy}
            temporal: {condition: service_healthy}

        postiz-postgres:
          image: postgres:17-alpine
          container_name: postiz-postgres
          restart: always
          environment:
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_USER: postiz-user
            POSTGRES_DB: postiz-db-local
          volumes: [postgres-volume:/var/lib/postgresql/data]
          networks: [postiz-network]
          healthcheck:
            test: pg_isready -U postiz-user -d postiz-db-local
            interval: 10s
            timeout: 3s
            retries: 3

        postiz-redis:
          image: redis:7.2
          container_name: postiz-redis
          restart: always
          healthcheck:
            test: redis-cli ping
            interval: 10s
            timeout: 3s
            retries: 3
          volumes: [postiz-redis-data:/data]
          networks: [postiz-network]

        temporal-elasticsearch:
          container_name: temporal-elasticsearch
          image: elasticsearch:7.17.27
          restart: always
          environment:
            - cluster.routing.allocation.disk.threshold_enabled=true
            - cluster.routing.allocation.disk.watermark.low=512mb
            - cluster.routing.allocation.disk.watermark.high=256mb
            - cluster.routing.allocation.disk.watermark.flood_stage=128mb
            - discovery.type=single-node
            - ES_JAVA_OPTS=-Xms256m -Xmx256m
            - xpack.security.enabled=false
          networks: [temporal-network]
          expose: ['9200']
          volumes: [temporal-es-data:/usr/share/elasticsearch/data]

        temporal-postgresql:
          container_name: temporal-postgresql
          image: postgres:16
          restart: always
          environment:
            POSTGRES_PASSWORD: temporal
            POSTGRES_USER: temporal
          networks: [temporal-network]
          expose: ['5432']
          volumes: [temporal-pg-data:/var/lib/postgresql/data]
          healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U temporal']
            interval: 10s
            timeout: 3s
            retries: 10

        temporal:
          container_name: temporal
          image: temporalio/auto-setup:1.28.1
          restart: always
          depends_on:
            temporal-postgresql: {condition: service_healthy}
            temporal-elasticsearch: {condition: service_started}
          environment:
            - DB=postgres12
            - DB_PORT=5432
            - POSTGRES_USER=temporal
            - POSTGRES_PWD=temporal
            - POSTGRES_SEEDS=temporal-postgresql
            - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
            - ENABLE_ES=true
            - ES_SEEDS=temporal-elasticsearch
            - ES_VERSION=v7
            - TEMPORAL_NAMESPACE=default
          networks: [temporal-network]
          volumes: ['./dynamicconfig:/etc/temporal/config/dynamicconfig']
          healthcheck:
            test: ['CMD', 'tctl', '--address', 'temporal:7233', 'cluster', 'health']
            interval: 10s
            timeout: 10s
            retries: 30
            start_period: 30s

        caddy:
          image: caddy:2
          container_name: caddy
          restart: always
          network_mode: host
          volumes:
            - ./Caddyfile:/etc/caddy/Caddyfile:ro
            - caddy-data:/data
            - caddy-config:/config

      volumes:
        postgres-volume:
        postiz-redis-data:
        postiz-config:
        postiz-uploads:
        temporal-es-data:
        temporal-pg-data:
        caddy-data:
        caddy-config:

      networks:
        postiz-network:
        temporal-network:
          driver: bridge
          name: temporal-network

  - path: /opt/postiz/backup.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      # Nightly backup: database dump plus uploads and config. Keeps 7 days.
      set -euo pipefail
      DEST=/opt/postiz/backups; mkdir -p "$DEST"; STAMP=$(date +%F)
      docker exec postiz-postgres pg_dump -U postiz-user postiz-db-local | gzip > "$DEST/db-$STAMP.sql.gz"
      docker run --rm -v postiz_postiz-uploads:/uploads:ro -v postiz_postiz-config:/config:ro \
        -v "$DEST":/backup alpine tar czf "/backup/files-$STAMP.tar.gz" /uploads /config
      find "$DEST" -type f -mtime +7 -delete

  - path: /opt/postiz/bootstrap.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      # Runs once on first boot. Every step is logged so the result can be
      # inspected later without anyone logging in.
      set -uo pipefail
      exec >>/var/log/postiz-bootstrap.log 2>&1
      log(){ echo "[$(date -Is)] $*"; }
      log "bootstrap starting"

      log "adding 4G swap"
      if [ ! -f /swapfile ]; then
        fallocate -l 4G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile
        grep -q '/swapfile' /etc/fstab || echo '/swapfile none swap sw 0 0' >> /etc/fstab
      fi

      log "installing docker"
      curl -fsSL https://get.docker.com -o /tmp/get-docker.sh
      sh /tmp/get-docker.sh
      systemctl enable --now docker

      log "generating secrets"
      cd /opt/postiz
      if [ ! -f .env ]; then
        JWT=$(openssl rand -base64 48 | tr -d '\n=/+' | cut -c1-56)
        PGPW=$(openssl rand -hex 16)
        cat > .env <<EOF
      MAIN_URL=https://post.sugimotogroup.org
      FRONTEND_URL=https://post.sugimotogroup.org
      NEXT_PUBLIC_BACKEND_URL=https://post.sugimotogroup.org/api
      JWT_SECRET=$JWT
      POSTGRES_PASSWORD=$PGPW
      DISABLE_REGISTRATION=false
      FACEBOOK_APP_ID=2133564544263694
      FACEBOOK_APP_SECRET=
      YOUTUBE_CLIENT_ID=
      YOUTUBE_CLIENT_SECRET=
      X_API_KEY=
      X_API_SECRET=
      TIKTOK_CLIENT_ID=
      TIKTOK_CLIENT_SECRET=
      EOF
        chmod 600 .env
      fi

      log "pulling images"
      docker compose pull
      log "starting stack"
      docker compose up -d

      log "waiting for postiz on 127.0.0.1:4007"
      for i in $(seq 1 90); do
        code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:4007/ || true)
        if [ "$code" != "000" ]; then log "postiz answered HTTP $code after $((i*10))s"; break; fi
        sleep 10
      done

      log "installing nightly backup at 03:30"
      (crontab -l 2>/dev/null; echo "30 3 * * * /opt/postiz/backup.sh >> /var/log/postiz-backup.log 2>&1") | sort -u | crontab -

      log "container status"
      docker compose ps
      log "bootstrap finished"
      touch /var/lib/cloud/postiz-bootstrap-done

runcmd:
  - [ bash, /opt/postiz/bootstrap.sh ]
