  const key = new URL(url, location.href).searchParams.get('only');
  if (key === 'ON') return Promise.reject(new Error('simulated network failure'));
  return new Promise(res => setTimeout(() =>
    res({ ok:true, json:() => Promise.resolve(MOCK[key] || { rounds:[], pnpDraws:{} }) }), 260));
