# Render Blueprint — anniversary website
#
# Deploys the static site in anniversary/ (index.html + images + audio).
# There is nothing to compile, so the build step is a no-op.
#
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: hamed-and-yasi
    runtime: static
    branch: claude/anniversary-website-samples-tnktph
    buildCommand: echo "static site - nothing to build"
    staticPublishPath: ./anniversary

    # Only redeploy when the site itself changes, not on unrelated commits.
    buildFilter:
      paths:
        - anniversary/**

    headers:
      # Photos are content-addressed by name and never edited in place.
      - path: /images/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # The song may be replaced, so keep its cache short.
      - path: /audio/*
        name: Cache-Control
        value: public, max-age=86400
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
