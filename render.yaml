# Render Blueprint — self-hosted Cal.com for Sugimoto Visa
#
# Deploys the official prebuilt Cal.com image (no build from source; the image
# runs its own Prisma migrations on boot) plus a dedicated Postgres instance.
#
# Apply: Render Dashboard -> New -> Blueprint -> select this repo -> Apply.
# Render prompts for every `sync: false` variable during the creation flow.
# Secrets are deliberately NOT committed here.

databases:
  - name: cal-postgres
    plan: basic-1gb
    postgresMajorVersion: '16'
    region: oregon

services:
  - type: web
    runtime: image
    name: cal-web
    plan: standard # 2 GB RAM — Cal.com OOMs on smaller instance types
    region: oregon # must match cal-postgres for private-network DB access
    healthCheckPath: /auth/login
    autoDeployTrigger: 'off'
    image:
      url: docker.io/calcom/cal.com:latest
    domains:
      - cal.sugimotovisa.com
    envVars:
      - key: PORT
        value: '3000'

      # `connectionString` is the private-network (internal) URL, which is what
      # we want: the web service and the database share the oregon region.
      - key: DATABASE_URL
        fromDatabase:
          name: cal-postgres
          property: connectionString
      - key: DATABASE_DIRECT_URL
        fromDatabase:
          name: cal-postgres
          property: connectionString

      - key: NEXT_PUBLIC_WEBAPP_URL
        value: https://cal.sugimotovisa.com
      - key: NEXTAUTH_URL
        value: https://cal.sugimotovisa.com

      # Secrets — supplied via the dashboard prompt, never stored in git.
      - key: NEXTAUTH_SECRET
        sync: false
      - key: CALENDSO_ENCRYPTION_KEY
        sync: false
      - key: CRON_API_KEY
        sync: false

      - key: NEXT_PUBLIC_LICENSE_CONSENT
        value: agree
      - key: CALCOM_TELEMETRY_DISABLED
        value: '1'

      # Mail is sent through the IONOS-hosted booking@ mailbox.
      # Regional endpoint: use smtp.ionos.co.uk / smtp.ionos.de instead if the
      # IONOS account is UK/DE rather than US.
      - key: EMAIL_FROM
        value: booking@sugimotovisa.com
      - key: EMAIL_SERVER_HOST
        value: smtp.ionos.com
      # 465 = implicit SSL. If the host blocks 465, switch to 587 (STARTTLS).
      - key: EMAIL_SERVER_PORT
        value: '465'
      # IONOS authenticates with the full email address as the username.
      - key: EMAIL_SERVER_USER
        value: booking@sugimotovisa.com
      # The IONOS mailbox password itself — IONOS has no scoped app-password
      # equivalent, so treat booking@ as a send-only mailbox. The app boots
      # without this; outbound email fails until it is set.
      #
      # Mail also requires MX + SPF + DKIM records for sugimotovisa.com in
      # Cloudflare (authoritative DNS), not in IONOS.
      - key: EMAIL_SERVER_PASSWORD
        sync: false
