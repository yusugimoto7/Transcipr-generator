# Render Blueprint — deploys the Canada Visa Platform with one click.
# In Render: New + -> Blueprint -> select this repo -> Apply.
# Docs: https://render.com/docs/blueprint-spec
#
# NOTE: this file intentionally does NOT deploy the topic-engine app at the
# repo root; it only defines the visa platform under /platform.

services:
  - type: web
    name: canada-visa-platform
    runtime: docker
    plan: starter
    rootDir: platform
    dockerfilePath: ./Dockerfile
    branch: claude/canada-visa-permit-platform-1nd07u
    autoDeploy: true
    healthCheckPath: /api/health
    # The disk holds the platform's records and a cache of recently used files;
    # the files themselves are kept in Google Drive (platform/README.md →
    # "Where files are kept"). CACHE_MAX_MB keeps the cache under the disk size.
    disk:
      name: visa-data
      mountPath: /data
      sizeGB: 1
    envVars:
      # Enter your key from platform.openai.com when Render prompts for it.
      - key: OPENAI_API_KEY
        sync: false
      # Render generates a strong random value automatically.
      - key: AUTH_SECRET
        generateValue: true
      # Your email address. The account registered with this email is ADMIN:
      # it manages account managers and assigns files. Comma-separate for more.
      - key: ADMIN_EMAIL
        sync: false
      # Optional — "Import from Google Drive". Paste the whole service-account
      # JSON key; then share the client-files folder with its email (Viewer).
      # See platform/README.md → "Import a client's documents from Google Drive".
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      # Optional — email intake: the team mailbox (IMAP at IONOS) and the Drive
      # folder that holds the client folders. See platform/README.md → "Email intake".
      - key: MAIL_USER
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: DRIVE_CLIENTS_FOLDER
        sync: false
      # Server cache limit (MB) — keep it below the disk size (1 GB).
      - key: CACHE_MAX_MB
        value: "600"
      # Optional — second, independent document checker (Claude). See README.
      - key: ANTHROPIC_API_KEY
        sync: false
